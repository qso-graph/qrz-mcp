name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: Unit tests
        run: uv run pytest tests --ignore=tests/test_security.py -v

      - name: Security tests
        run: uv run pytest tests/test_security.py -v

  ci-all-green:
    name: ci-all-green
    needs: [test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs all succeeded
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "FAIL: test matrix did not all succeed (result=${{ needs.test.result }})"
            exit 1
          fi
          echo "All required CI jobs passed."
